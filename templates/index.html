<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asif Mahmud - AI Assistant</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            animation: changeBg 10s infinite alternate;
            margin: 0;
            padding: 20px;
        }

        @keyframes changeBg {
            0% { background-color: #ff5757; }
            25% { background-color: #ff9f43; }
            50% { background-color: #f5cd79; }
            75% { background-color: #55efc4; }
            100% { background-color: #74b9ff; }
        }

        h1 {
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .video-container {
            margin: 20px auto;
            max-width: 800px;
        }

        iframe {
            width: 100%;
            height: 450px;
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .chat-container {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            max-width: 800px;
            margin: 0 auto;
        }

        #chat-box {
            height: 300px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 10px;
            margin-bottom: 10px;
            text-align: left;
            border-radius: 5px;
            background: #f9f9f9;
        }

        #user-input {
            width: 70%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-right: 10px;
        }

        button {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .message {
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
            max-width: 80%;
        }

        .user-message {
            background: #e3f2fd;
            margin-left: auto;
            text-align: right;
        }

        .ai-message {
            background: #f5f5f5;
            margin-right: auto;
            text-align: left;
        }

        .social-links {
            margin-top: 20px;
        }

        .social-links a {
            margin: 0 10px;
            padding: 10px 20px;
            background: #dc3545;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
        }

        .social-links a:hover {
            background: #c82333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 Peaceful Islamic Nasheed 🎵</h1>

        <div class="video-container">
            <iframe 
                src="https://www.youtube.com/embed/YiSQ_db-Dcw?autoplay=1&mute=1&controls=0" 
                title="YouTube video player" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                referrerpolicy="strict-origin-when-cross-origin" 
                allowfullscreen>
            </iframe>
        </div>

        <div class="chat-container">
            <h2>💬 Chat with AI Assistant</h2>
            <div id="chat-box"></div>
            <div>
                <input type="text" id="user-input" placeholder="Type your message here..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>

        <div class="social-links">
            <a href="https://www.youtube.com/channel/UCwPxPdiQNcYYGNkTZ68dogQ" target="_blank">📺 YouTube</a>
            <a href="https://www.facebook.com/share/15yVioQQyq/" target="_blank">📘 Facebook</a>
        </div>
    </div>

    <script>
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function sendMessage() {
            const userInput = document.getElementById('user-input');
            const message = userInput.value.trim();
            
            if (message === '') return;

            // Add user message to chat
            addMessage(message, 'user');
            userInput.value = '';

            // Get AI response
            fetch(`/chat?message=${encodeURIComponent(message)}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.reply) {
                        addMessage(data.reply, 'ai');
                    } else {
                        addMessage('Sorry, I did not understand that. Please try again.', 'ai');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    addMessage('Sorry, I encountered an error. Please try again.', 'ai');
                });
        }

        function addMessage(text, sender) {
            const chatBox = document.getElementById('chat-box');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}-message`;
            messageDiv.textContent = text;
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Add welcome message
        window.onload = function() {
            addMessage('Hello! I am an AI assistant for Asif Mahmud. How can I help you today?', 'ai');
        }
    </script>
</body>
</html>
