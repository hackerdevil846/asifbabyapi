<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silly AI Assistant</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            animation: changeBg 10s infinite alternate;
            margin: 0;
            padding: 20px;
        }

        @keyframes changeBg {
            0% { background-color: #ff5757; }
            25% { background-color: #ff9f43; }
            50% { background-color: #f5cd79; }
            75% { background-color: #55efc4; }
            100% { background-color: #74b9ff; }
        }

        h1 {
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .video-container {
            margin: 20px auto;
            max-width: 800px;
        }

        iframe {
            width: 100%;
            height: 450px;
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .chat-container {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            max-width: 800px;
            margin: 0 auto;
        }

        #chat-box {
            height: 300px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 15px;
            text-align: left;
            border-radius: 10px;
            background: #f9f9fa;
        }

        #user-input {
            width: 70%;
            padding: 12px;
            border: 2px solid #e84393;
            border-radius: 25px;
            margin-right: 10px;
            font-size: 16px;
            outline: none;
        }

        button {
            padding: 12px 25px;
            background: #e84393;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        button:hover {
            background: #fd79a8;
            transform: scale(1.05);
        }

        .message {
            margin: 12px 0;
            padding: 12px;
            border-radius: 15px;
            max-width: 80%;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            background: #e84393;
            color: white;
            margin-left: auto;
            text-align: right;
        }

        .ai-message {
            background: #74b9ff;
            color: white;
            margin-right: auto;
            text-align: left;
        }

        .social-links {
            margin-top: 20px;
        }

        .social-links a {
            margin: 0 10px;
            padding: 12px 25px;
            background: #00b894;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            transition: 0.3s;
            display: inline-block;
        }

        .social-links a:hover {
            background: #55efc4;
            transform: translateY(-2px);
        }

        .typing {
            display: none;
            color: #e84393;
            font-style: italic;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 Peaceful Islamic Nasheed 🎵</h1>

        <div class="video-container">
            <iframe 
                src="https://www.youtube.com/embed/YiSQ_db-Dcw?autoplay=1&controls=1" 
                title="YouTube video player" 
                allowfullscreen>
            </iframe>
        </div>

        <div class="chat-container">
            <h2>💬 Chat with Silly AI</h2>
            <div id="chat-box"></div>
            <div class="typing" id="typing">Silly is thinking... 💭</div>
            <div>
                <input type="text" id="user-input" placeholder="Ask me anything sweetie... 💕" onkeypress="if(event.key=='Enter') sendMessage()">
                <button onclick="sendMessage()">Send 💌</button>
            </div>
        </div>

        <div class="social-links">
            <a href="https://www.youtube.com/channel/UCwPxPdiQNcYYGNkTZ68dogQ" target="_blank">📺 YouTube</a>
            <a href="https://www.facebook.com/share/15yVioQQyq/" target="_blank">📘 Facebook</a>
        </div>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('user-input');
            const message = input.value.trim();
            
            if (!message) return;

            addMessage(message, 'user');
            input.value = '';
            
            // Show typing indicator
            const typing = document.getElementById('typing');
            typing.style.display = 'block';
            
            fetch(`/chat?message=${encodeURIComponent(message)}`)
                .then(response => {
                    if (!response.ok) throw new Error('Network error');
                    return response.json();
                })
                .then(data => {
                    typing.style.display = 'none';
                    addMessage(data.reply, 'ai');
                })
                .catch(error => {
                    typing.style.display = 'none';
                    addMessage('Oops! Having connection issues. Try again sweetie! 💕', 'ai');
                });
        }
        
        function addMessage(text, sender) {
            const chatBox = document.getElementById('chat-box');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}-message`;
            messageDiv.innerHTML = text.replace(/\n/g, '<br>');
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
        
        // Welcome message
        window.onload = function() {
            addMessage('Hi there! I\'m Silly, your AI bestie! 💖 How can I make your day better? 🌸', 'ai');
        }
    </script>
</body>
</html>
